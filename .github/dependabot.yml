version: 2
updates:
  # Rust dependencies: one pull request per update, checked by the CI.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  # Versions of the GitHub Actions used by the CI.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The toolchain tag of the msrv job is the MSRV (rust-version in
      # Cargo.toml), changed by hand only; the test job follows @stable.
      # The action also publishes tags for future Rust versions (1.120…).
      - dependency-name: dtolnay/rust-toolchain
