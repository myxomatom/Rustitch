[workspace]
resolver = "3"
members = ["crates/emb-core", "crates/emb-formats", "crates/emb-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/myxomatom/Rustitch"

[workspace.dependencies]
emb-core = { path = "crates/emb-core", version = "0.1.0" }
emb-formats = { path = "crates/emb-formats", version = "0.1.0" }

thiserror = "2.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }

proptest = "1.6"
insta = "1.42"
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
indexing_slicing = "warn"
float_cmp = "deny"
